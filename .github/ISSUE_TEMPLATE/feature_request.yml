name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature! ✨
        
        Please fill out this form to help us understand your proposal.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm you have completed the following
      options:
        - label: I have searched existing issues to ensure this feature hasn't been requested
          required: true
        - label: I have reviewed the roadmap to see if this is already planned
          required: true
        - label: I have considered if this fits the SharedKernel philosophy
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 🚩 Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 📦 Target Component
      description: Which part of the SharedKernel should this feature be added to?
      options:
        - Domain Layer
        - Application Layer
        - Infrastructure Layer
        - Persistence Layer
        - Presentation Layer
        - Documentation
        - Tooling/Templates
        - Multiple Components
        - New Component
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 🎯 Priority
      description: How important is this feature to you?
      options:
        - Critical (Blocking current work)
        - High (Important for next release)
        - Medium (Nice to have soon)
        - Low (Someday/maybe)
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: 🔧 Estimated Complexity
      description: How complex do you think this feature is to implement?
      options:
        - Simple (Few hours of work)
        - Medium (1-2 days of work)
        - Complex (Several days of work)
        - Major (Weeks of work)
        - Unknown
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives Considered
      description: Describe alternatives you've considered
      placeholder: A clear and concise description of any alternative solutions or features you've considered...

  - type: textarea
    id: api_design
    attributes:
      label: 🎨 API Design (if applicable)
      description: Show how you envision the API for this feature
      placeholder: |
        // Example API usage
        public class ExampleFeature
        {
            public Result<T> DoSomething(Parameters parameters)
            {
                // Implementation
            }
        }
      render: csharp

  - type: textarea
    id: use_cases
    attributes:
      label: 🎯 Use Cases
      description: Describe specific use cases for this feature
      placeholder: |
        1. As a developer, I want to...
        2. When building microservices, I need to...
        3. For enterprise applications, this would help...

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: ✅ Acceptance Criteria
      description: Define what "done" looks like for this feature
      placeholder: |
        - [ ] Feature implements X functionality
        - [ ] Documentation is updated
        - [ ] Tests are added
        - [ ] Examples are provided

  - type: textarea
    id: breaking_changes
    attributes:
      label: ⚠️ Breaking Changes
      description: Would this feature require breaking changes?
      placeholder: Describe any potential breaking changes and how to mitigate them...

  - type: textarea
    id: implementation_ideas
    attributes:
      label: 🛠️ Implementation Ideas
      description: Do you have ideas about how this could be implemented?
      placeholder: Share any implementation thoughts or constraints...

  - type: textarea
    id: references
    attributes:
      label: 📚 References
      description: Links to related documentation, standards, or examples
      placeholder: |
        - https://example.com/relevant-documentation
        - Similar implementation in other frameworks
        - Industry standards or best practices

  - type: textarea
    id: additional
    attributes:
      label: 📝 Additional Context
      description: Add any other context, screenshots, or mockups about the feature request
      placeholder: Any additional information...

  - type: checkboxes
    id: contribution
    attributes:
      label: 🤝 Contribution
      description: Are you willing to help implement this feature?
      options:
        - label: I am willing to submit a pull request for this feature
          required: false
        - label: I can help with documentation for this feature
          required: false
        - label: I can help with testing this feature
          required: false
name: 🚀 Release

on:
  release:
    types: [published]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: 🚀 Release to NuGet
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: dotnet restore Baobab.sln

    - name: 🧪 Run tests
      run: dotnet test Baobab.sln --configuration Release --verbosity normal

    - name: 📦 Create packages
      run: dotnet pack Baobab.sln --configuration Release --output ./packages

    - name: 🔑 NuGet Login (OIDC trusted publishing)
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: Nana_Gyan_Ayeh

    - name: 🚀 Push to NuGet
      run: dotnet nuget push ./packages/*.nupkg --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package --skip-duplicate

    - name: 📤 Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-packages
        path: ./packages/*.nupkg
        retention-days: 90

  github-release:
    name: 📋 Update GitHub Release
    runs-on: ubuntu-latest
    needs: release

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📋 Generate Release Notes
      id: release_notes
      run: |
        echo "## 🎉 What's New" > release_notes.md
        echo "" >> release_notes.md
        echo "This release includes the following NuGet packages:" >> release_notes.md
        echo "" >> release_notes.md
        echo "- \`Baobab.SharedKernel.Domain\`" >> release_notes.md
        echo "- \`Baobab.SharedKernel.Application\`" >> release_notes.md
        echo "- \`Baobab.SharedKernel.Infrastructure\`" >> release_notes.md
        echo "- \`Baobab.SharedKernel.Persistence\`" >> release_notes.md
        echo "- \`Baobab.SharedKernel.Presentation\`" >> release_notes.md
        echo "" >> release_notes.md
        echo "## 📦 Installation" >> release_notes.md
        echo "" >> release_notes.md
        echo "\`\`\`bash" >> release_notes.md
        echo "dotnet add package Baobab.SharedKernel.Domain --version ${{ github.event.release.tag_name }}" >> release_notes.md
        echo "dotnet add package Baobab.SharedKernel.Application --version ${{ github.event.release.tag_name }}" >> release_notes.md
        echo "dotnet add package Baobab.SharedKernel.Infrastructure --version ${{ github.event.release.tag_name }}" >> release_notes.md
        echo "dotnet add package Baobab.SharedKernel.Persistence --version ${{ github.event.release.tag_name }}" >> release_notes.md
        echo "dotnet add package Baobab.SharedKernel.Presentation --version ${{ github.event.release.tag_name }}" >> release_notes.md
        echo "\`\`\`" >> release_notes.md
        echo "" >> release_notes.md
        echo "See [CHANGELOG.md](./CHANGELOG.md) for detailed changes." >> release_notes.md

    - name: 📋 Update Release
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const releaseNotes = fs.readFileSync('release_notes.md', 'utf8');

          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: ${{ github.event.release.id }},
            body: releaseNotes
          });

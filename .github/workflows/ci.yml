name: 🚀 Continuous Integration

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: dotnet restore Baobab.sln

    - name: 🏗️ Build
      run: dotnet build Baobab.sln --no-restore --configuration Release

    - name: 🧪 Run tests
      run: dotnet test Baobab.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: 📊 Upload coverage reports
      if: success()
      uses: codecov/codecov-action@v3
      with:
        file: '**/coverage.cobertura.xml'
        flags: unittests
        name: codecov-umbrella

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: dotnet restore Baobab.sln

    - name: 🏗️ Build
      run: dotnet build Baobab.sln --no-restore --configuration Release

  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: dotnet restore Baobab.sln

    - name: 🏗️ Build
      run: dotnet build Baobab.sln --no-restore --configuration Release

    - name: 📦 Create packages
      run: dotnet pack Baobab.sln --no-build --configuration Release --output ./packages

    - name: 📤 Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
        retention-days: 30
